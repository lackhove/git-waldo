[project]
name = "tarssh"
version = "0.1.0"
description = "A git remote helper for hosts with only busybox find and tar"
requires-python = ">=3.11"
dependencies = [
    "pathspec>=1.1.1",
]

[project.scripts]
git-remote-tarssh = "tarssh.remote:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tarssh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
